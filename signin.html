<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Netflix Sign In</title>

  <link rel="stylesheet" href="./src/output.css">

</head>


<body class="min-h-screen bg-black text-white">


  <div
    class="min-h-screen bg-cover bg-center">

    <div class="min-h-screen bg-black/60">


      <header class="px-6 py-6 md:px-12">

        <a
          href="index.html"
          class="text-red-600 text-3xl md:text-5xl font-extrabold"
        >
          NETFLIX
        </a>

      </header>

      <main class="flex justify-center px-6 py-12">

        <div
          class="w-full max-w-lg
                 bg-black/80
                 rounded-md
                 px-10 py-12
                 md:px-14 md:py-16"
        >

          <h1 class="text-3xl font-bold mb-8">
            Sign In
          </h1>

          <div class="mb-4">

            <input
              type="email"
              placeholder="Email or mobile number"
              class="w-full
                     bg-[#333]
                     rounded
                     px-4 py-4
                     text-white
                     placeholder-gray-400
                     outline-none
                     focus:bg-[#454545]"
            >

          </div>


          <div class="mb-6">

            <input
              type="password"
              placeholder="Password"
              class="w-full
                     bg-[#333]
                     rounded
                     px-4 py-4
                     text-white
                     placeholder-gray-400
                     outline-none
                     focus:bg-[#454545]"
            >

          </div>


          <button
            class="w-full
                   bg-red-600
                   hover:bg-red-700
                   text-white
                   py-3
                   rounded
                   font-bold
                   transition"
          >
            Continue
          </button>


          <div
            class="flex
                   items-center
                   justify-between
                   mt-4
                   text-sm
                   text-gray-400"
          >

            <label class="flex items-center gap-2">

              <input
                type="checkbox"
                class="accent-red-600"
              >

              Remember me

            </label>

            <a href="#" class="hover:underline">
              Need help?
            </a>

          </div>


          <p class="mt-12 text-gray-400">

            New to Netflix?

            <a
              href="index.html"
              class="text-white hover:underline"
            >
              Sign up now.
            </a>

          </p>


          <p class="mt-4 text-xs text-gray-500 leading-relaxed">

            This page is a clone of Netflix and is not affiliated with Netflix, Inc. It is for educational purposes only.

            <a href="#" class="text-blue-500 hover:underline">
          
            </a>

          </p>

        </div>

      </main>

    </div>

  </div>

</body>

</html>
