<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Netflix Sign Up</title>

  <link rel="stylesheet" href="./src/output.css">

</head>


<body class="min-h-screen bg-black text-white">

  <header class="flex items-center justify-between px-6 py-6 md:px-12">

    <a
      href="index.html"
      class="text-red-600 text-3xl md:text-5xl font-extrabold"
    >
      NETFLIX
    </a>

    <a
      href="signin.html"
      class="text-white font-semibold hover:underline"
    >
      Sign In
    </a>

  </header>


  <main class="flex justify-center px-6 py-12">

    <div class="w-full max-w-lg">

      <h1 class="text-3xl md:text-4xl font-bold mb-4">
        Create a password to start your membership
      </h1>

      <p class="text-gray-300 mb-8">
        Just a few more steps and you're done!
      </p>


      <div class="mb-4">

        <label class="block text-sm font-medium mb-2">
          Email
        </label>

        <input
          type="email"
          placeholder="Email address"
          class="w-full
                 bg-[#333]
                 border border-gray-500
                 rounded
                 px-4 py-4
                 text-white
                 placeholder-gray-400
                 outline-none
                 focus:border-white"
        >

      </div>


      <div class="mb-6">

        <label class="block text-sm font-medium mb-2">
          Password
        </label>

        <input
          type="password"
          placeholder="Add a password"
          class="w-full
                 bg-[#333]
                 border border-gray-500
                 rounded
                 px-4 py-4
                 text-white
                 placeholder-gray-400
                 outline-none
                 focus:border-white"
        >

      </div>

      <button
        class="w-full
               bg-red-600
               hover:bg-red-700
               text-white
               py-4
               rounded
               font-bold
               text-lg
               transition"
      >
        Continue
      </button>


      <p class="text-gray-500 text-xs leading-relaxed mt-6">

        By continuing, you agree to our Terms of Use and acknoledwge our Privacy Statement.
        </a>

      </p>

    </div>

  </main>


  <footer class="border-t border-gray-800 mt-12 px-6 py-10">

    <div class="max-w-5xl mx-auto">

      <p class="text-gray-400 mb-6">
        Questions? Contact us.
        <a href="#" class="underline hover:text-white">

        </a>
      </p>
      </div>

</body>

</html>
